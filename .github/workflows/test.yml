name: Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'stackunderflow/**'
      - 'tests/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'stackunderflow/**'
      - 'tests/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/test.yml'

jobs:
  test:
    # The full suite runs on Ubuntu. A Windows pytest foothold lives in the
    # `test-windows` job below (cross-platform path tests). The remaining
    # suite stays Ubuntu-only because of POSIX-shaped fixtures (hard-coded
    # `/Users/...` literals — mostly inert recorded session data — and raw
    # `Path.resolve()` that drive-prefixes on Windows). Port more modules to
    # the Windows job using `tests/conftest.py::assert_same_path`; tracked as
    # HANDOFF #4 follow-up.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        # Skip performance tests in CI as they require specific test data
        python -m pytest tests/ -v --tb=short --cov=stackunderflow --cov-report=term-missing --ignore=tests/stackunderflow/test_performance.py

    - name: Check test coverage
      run: |
        # Fail if coverage is below 60%
        coverage report --fail-under=60

  contract:
    # Conformance gate for the `stackunderflow.memory/1` agent-output contract.
    # The checker is stdlib-only (no pip install needed): it validates every
    # golden fixture under contracts/stackunderflow-memory-v1/ against the
    # shipped JSON-Schema, proves an unknown additive field is forward-compatible,
    # and self-tests that a broken envelope is rejected.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Check the stackunderflow.memory/1 contract
      run: python scripts/check_memory_contract.py

  test-windows:
    # Windows pytest foothold. Runs the cross-platform path-resolution tests
    # on a real Windows runner to lock in the per-OS storage-root branches
    # (Cline / Kiro / Cursor / Copilot) and the CLAUDE_CONFIG_DIR override.
    # Expand the pytest target as more modules are ported (see the `test`
    # job comment + tests/conftest.py::assert_same_path).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run cross-platform path tests
      run: python -m pytest tests/stackunderflow/adapters/test_platform_paths.py -v --tb=short