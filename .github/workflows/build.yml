name: Build and Test Package

on:
  push:
    branches: [ main ]
    paths:
      - 'stackunderflow/**'
      - 'stackunderflow-ui/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'stackunderflow/**'
      - 'stackunderflow-ui/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Build React UI
      run: |
        cd stackunderflow-ui
        npm ci
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
        name: dist-package
        path: dist/
        retention-days: 3

  smoke-test:
    name: Smoke Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5  # needed for scripts/smoke_discovery.py

    - name: Download build artifact
      uses: actions/download-artifact@v5
      with:
        name: dist-package
        path: dist

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true

    - name: Install package (POSIX)
      if: runner.os != 'Windows'
      run: pip install dist/*.whl

    - name: Install package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
        pip install $wheel.FullName

    - name: Test CLI commands
      run: |
        stackunderflow --version
        stackunderflow --help
        stackunderflow cfg ls

    # Exercises the real OS-specific path code (Path.home / CLAUDE_CONFIG_DIR
    # resolution + JSONL discovery + parse) on every OS — the cross-platform
    # surface the Linux-only pytest matrix can't cover on Windows.
    - name: Discovery smoke
      run: python scripts/smoke_discovery.py