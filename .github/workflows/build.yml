name: Build and Test Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Build React UI
      run: |
        cd stackunderflow-ui
        npm ci
        npm run build

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build
    
    - name: Install package (POSIX)
      if: runner.os != 'Windows'
      run: pip install dist/*.whl

    - name: Install package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # PowerShell does not expand `dist/*.whl` the way POSIX shells do.
        $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
        pip install $wheel.FullName
    
    - name: Test CLI commands
      run: |
        stackunderflow --version
        stackunderflow --help
        stackunderflow cfg ls
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: dist-${{ matrix.os }}-py${{ matrix.python-version }}
        path: dist/
        retention-days: 3