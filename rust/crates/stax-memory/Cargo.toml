[package]
name = "stax-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order` is the wave-0 workspace decision (docs/specs/rust-port.md §6,
# recorded in rust/ARCHITECT-STATE.md finding 6): it swaps serde_json's Map for
# an IndexMap so a parsed envelope keeps the key order Python emitted. Without
# it the byte-parity goal for the wire contracts downgrades to shape-parity on
# the first `query` / `results[]` object round-tripped. Declared here rather
# than in `[workspace.dependencies]` because this crate owns the contracts;
# cargo's feature unification turns it on workspace-wide anyway.
#
# `float_roundtrip` is NOT optional either, and the goldens proved it. Without
# it serde_json's fast float parser lands one ULP off CPython's on long
# decimals: `499.25254474999997` in `file.success.json` came back as
# `499.25254475` (0x407f340a6c5d206c vs …6d — two different f64 values, each
# correctly shortest-printed). Three shipped/added goldens diverged and two
# `token_estimate`s shifted with them, because the estimate counts the
# serialised characters. Cost is ~2x on float parsing; correctness of a wire
# contract is not negotiable at any multiple.
serde_json = { workspace = true }
