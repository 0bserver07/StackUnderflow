[package]
name = "stax-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Crate-local on purpose (the notify precedent in stax-etl): serde-derive is
# needed only here, for the signature catalog. The catalog itself is JSON, not
# YAML — Spec 28 §6 models it on adapters/capabilities.json, and JSON keeps the
# workspace's zero-new-parser stance (serde_json is already a workspace dep).
[dependencies]
anyhow.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json.workspace = true
