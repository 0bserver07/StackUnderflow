[package]
name = "stax-etl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `stax_core::queries::pyjson` is the Python-semantics JSON model the
# normalizers need and must not fork: a `messages` row's values carry Python's
# int/float split (`sqlite3` hands back `int` for INTEGER and `float` for REAL,
# and `int(x or 0)` behaves differently on each), object keys are
# insertion-ordered because `raw_extras` is re-serialised with `json.dumps`
# whose output is a byte contract, and `dumps_default` is exactly
# `json.dumps(obj)` — default `", "` / `": "` separators, `ensure_ascii=True`.
# Re-implementing any of that here is how two ports drift. etl → core is the
# charter's dependency direction (§3); nothing flows the other way.
stax-core.workspace = true
stax-memory.workspace = true
# The normalize *pass* streams `messages` and writes `usage_events` on a store
# copy — the wave-3 parity proof. A plain dependency, not a feature: the
# architect's binding ruling on db-kind consumers (feature unification would let
# one member's build decide whether another member's normalize pass exists).
rusqlite.workspace = true
# The mart layer's error type. Every builder returns `Result<_>` because a mart
# refresh is one leg of a transaction the caller owns; `anyhow` keeps the SQL
# context attached without inventing an error enum nobody matches on.
anyhow.workspace = true
# `project_mart`'s second pass parses `messages.raw_json` and runs the real
# classifier + enricher over it, so this crate needs a JSON value model.
#
# `preserve_order` + `float_roundtrip` come from the workspace (§6's byte-parity
# decision and the measured 1-ULP CPython parse divergence). `unbounded_depth`
# is added here for the same reason `stax-adapters` adds it: it gates ONE method
# (`Deserializer::disable_recursion_limit`) and changes no default, so the
# 128-container limit still applies everywhere it is not explicitly opted out
# of. `marts::json` opts in per blob, after a byte scan has bounded the depth —
# without it a `raw_json` deeper than 128 containers would parse in CPython and
# be *skipped* here, which on the dims path is a changed dimension rather than a
# dropped record. Features are not recorded in Cargo.lock, so this adds no lock
# churn for the fleet.
serde_json = { workspace = true, features = ["unbounded_depth"] }
# WAVE 4 — promoted from a dev-dependency to a real one.
#
# The ingest layer *is* the seam between the adapters and the store: `ingest_file`
# takes a `SessionRef` and a `&dyn SourceAdapter` and turns the `Record`s they
# yield into `messages` rows. There is no way to express that without the
# contract types, and re-declaring them here is the exact drift the single
# `base.rs` exists to prevent.
#
# The charter's dependency direction is unchanged: `stax-adapters` depends on
# nothing but `anyhow` + `rusqlite`, so `etl → adapters → ()` stays acyclic and
# the architect's "adapters stay storage-free" ruling still holds — the
# `PostIngestHook` trait that replaces Python's `getattr(adapter,
# "materialize_metadata")` lives HERE (`ingest::hooks`), not over there.
#
# The `[dev-dependencies]` entry below is now redundant but kept, deliberately:
# `tests/fixture_parity.rs` needs the adapters, and dropping the dev entry would
# make that test's dependency invisible if this one is ever narrowed.
stax-adapters = { path = "../stax-adapters" }

# WAVE 4 — the filesystem watcher (`etl/watcher.py`, `notify` per spec §3).
#
# LOCK ADDITION, documented per the campaign's anti-drift rule: this is the
# first third-party crate the port adds beyond the wave-0 four
# (anyhow/clap/rusqlite/serde_json). `notify 8.2.0` pulls
# `notify-types`/`inotify`/`inotify-sys`/`filetime`/`log`/`walkdir`/`same-file`
# on Linux; `Cargo.lock` records them.
#
# `default-features = false` is the smallest set that still works: notify's
# defaults are `macos_fsevent` (irrelevant off macOS) and `crossbeam-channel`
# (an extra dependency whose only purpose is letting callers select on a
# crossbeam channel — the watcher thread here owns a plain `std::sync::mpsc`).
# CORRECTION (Mac relay via inbox, 2026-08-04): the kqueue fallback premise was
# WRONG — notify 8.2.0 compiles fsevent.rs unconditionally on macOS while
# fsevent-sys is feature-gated, so default-features=false fails E0432 there.
# macos_fsevent is therefore ON (inert on every other target).
# The per-platform backend — inotify on Linux, ReadDirectoryChangesW on Windows,
# kqueue on the BSDs — is unconditional and is what we actually use. Turning
# `macos_fsevent` back on is a one-word change if wave 8's packaging wants
# FSEvents over the kqueue fallback on macOS; it is not a parity question.
#
# Target-gated so wave 9's `wasm32` build of this crate cannot be broken by a
# dependency that has no wasm backend. `ingest::watcher` is `#[cfg]`-ed off the
# same way, and everything else in `ingest` (the writer, the watermarks, the
# enumerate pass) stays available there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
# `tests/fixture_parity.rs` runs the SAME fourteen fixture packs through
# adapter -> normalizer that the Python suite's `test_beta_normalizers.py`
# does. Seven of them (codeium, continue, copilot, cursor-agent, kilocode,
# kiro, roocode) have ZERO rows on the maintainer's store, so the live-store
# diff says nothing about them and this is their only evidence. A dev-dep, not
# a dependency: the library must not need the adapters to normalize a row.
stax-adapters = { path = "../stax-adapters" }

# The normalize-pass harness: run the pass over a store COPY and dump
# `usage_events` in a form diffable against the Python originals driven over a
# second copy of the identical pre-state.
[[bin]]
name = "stax-normalize-parity"
path = "src/bin/normalize_parity.rs"

# The wave-3 mart gate: rebuild every mart on a store COPY and dump each mart
# table bit-exactly, so the same dumper can run over the Python-rebuilt copy.
[[bin]]
name = "stax-mart-parity"
path = "src/bin/mart_parity.rs"

# The wave-4 ingest gate: run a full ingest pass over a SCRATCH home, dump the
# four store tables full-row, and drive the live-tail latency measurement. The
# same dumper runs over the Python-ingested store.
[[bin]]
name = "stax-ingest-parity"
path = "src/bin/ingest_parity.rs"

# The wave-5 stats gate: dump `get_project_stats`' statistics payload for one
# project, block by block, in `json.dumps(..., separators=(",", ":"))` form so
# `rust/parity/stats_parity.py` produces a byte-comparable directory.
[[bin]]
name = "stax-stats-parity"
path = "src/bin/stats_parity.rs"
