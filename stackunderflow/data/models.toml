# Model manifest — the data-driven source of truth for model identity and
# pricing. This replaces hardcoded Python rate dicts and the token-matching
# `_identify` ladders that used to live in `infra/providers/*.py`.
#
# Adding a model, correcting a rate, or recording a price change is an edit to
# THIS file — not a code change and not a release-gated branch.
#
# ── Schema ──────────────────────────────────────────────────────────────────
# [[model]]
#   family          stable canonical key returned by canonicalize() (e.g. OPUS_48)
#   provider        pricer that owns it ("anthropic" — GLM is proxied as anthropic)
#   match           token set; an id matches when ALL tokens are present after
#                   splitting the lowercased id on "-" and "." (most-specific
#                   entries MUST come first — matching stops at the first hit)
#   fast_multiplier optional input/output multiplier for the priority/fast tier
#   fallback        optional; the family returned when nothing else matches
#   [[model.price]] one or more EFFECTIVE-DATED rate rows, $/M tokens:
#                   input, output, cache_write, cache_read, and optional
#                   effective_from / effective_until (ISO "YYYY-MM-DD" strings).
#                   A row with no dates is always-current. Pass a timestamp to
#                   price a historical event at the rate in effect then.
#
# Example of a price that changed over time (newest row open-ended):
#   [[model.price]]
#   effective_until = "2026-01-15"
#   input = 15.0 ; output = 75.0 ; cache_write = 18.75 ; cache_read = 1.50
#   [[model.price]]
#   effective_from = "2026-01-15"
#   input = 5.0  ; output = 25.0 ; cache_write = 6.25  ; cache_read = 0.50
#
# Cache-write defaults to 1.25× input and cache-read to 0.10× input under
# Anthropic's billing convention; GLM is surfaced through an Anthropic-shape
# proxy and follows the same multipliers.

# ── ZhipuAI GLM (proxied as anthropic) — most specific first ────────────────
[[model]]
family = "GLM_51"
provider = "anthropic"
match = ["glm", "5", "1"]
display_name = "GLM-5.1"
  [[model.price]]
  input = 1.40
  output = 4.40
  cache_write = 1.75
  cache_read = 0.14

[[model]]
family = "GLM_5"
provider = "anthropic"
match = ["glm", "5"]
display_name = "GLM-5"
  [[model.price]]
  input = 1.00
  output = 3.20
  cache_write = 1.25
  cache_read = 0.10

